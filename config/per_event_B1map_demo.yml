title: Per-Event B1 Map Demo - Different B1 fields for different RF pulses
pulseSeq:
    # First RF pulse with its own B1 map (stronger on left side)
    - t: 0
      FA: 90
      dur: 1
      phase: 90
      B1map:
        - - [1.2, 1.0, 0.8]
          - [1.2, 1.0, 0.8]
          - [1.2, 1.0, 0.8]
    
    # Second RF pulse with different B1 map (stronger on right side)
    - t: 100
      FA: 180
      dur: 2
      phase: 0
      B1map:
        - - [0.7, 0.9, 1.3]
          - [0.7, 0.9, 1.3]
          - [0.7, 0.9, 1.3]

TR: 200
B0: 1.5
nTR: 1

# 3x3 grid of locations
locations:
  - - [0.5, 0.7, 0.5]
    - [0.7, 1.0, 0.7]
    - [0.5, 0.7, 0.5]

components:
    - T1: 1000.0
      T2: 100.0
      CS: 0
      name: 'tissue'

nIsochromats: 3
locSpacing: 0.02  # 2 cm spacing

speed:
    - t: 0
      speed: 1

output:
    - file: per_event_B1map_demo_3D.gif
      type: 3D
      fps: 15
      azimuth: -60
      elevation: 20
    - file: per_event_B1map_demo_signal.gif
      type: xy
      fps: 15

plotArrowRate: 1
plotPositionRate: 1
collapseLocations: false
