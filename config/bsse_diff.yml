title: BSSE Diff
pulseSeq:
    - t: 0
      FA: 90
      B1: 'RF/exc_min_phase.yml'
      dur: 0.5 # [ms]
    - t: 3
      FA: 45
      B1: 'RF/bsse.yml'
      dur: 7.064 # [ms]
    - t: 12
      FA: 180
      B1: 'RF/ref.yml'
      dur: 0.5 # [ms]
    - t: 15
      FA: 45
      B1: 'RF/bsse.yml'
      dur: 7.064 # [ms]
TR: 25
nTR: 1 
B0: 1.5
components:
    - name: 'diffusing'
      T1: 790.0
      T2: 92.0
      Dx: 2
    - name: 'non-diffusing'
      T1: 790.0
      T2: 92.0
      Dx: 0
nIsochromats: 20
isochromatStep: 0.005
speed: 0.01

# Spatial B1 field map (simulating surface coil inhomogeneity)
# Values represent relative B1 strength: 1.0 = nominal, 0.5 = half strength
# Format is [[[z=0, row y, columns x]]]
B1map: [[[0,0.5,1,1.5,2]]]

# Five locations along x-axis where spins will experience different B1
locations: 
  'diffusing':
    [[[0, 0, 1, 0, 0]]]
  'non-diffusing':
    [[[0, 0, 1, 0, 0]]]

output: 
  - type: 3D
    file: bsse_diff.gif
  - type: psd
    file: bsse_diff_psd.gif
  - type: xy
    file: bsse_diff_xy.gif
  - type: z
    file: bsse_diff_z.gif